<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Welcome')}"></head>
<body class="login-body">
<main class="login">
  <section class="login-sheet" th:with="demo=${tab == 'demo'}, track=${tab == 'track'}">
    <div class="login-collar">
      <span class="mark-p4" style="--s:52px" aria-hidden="true">W</span>
      <div>
        <h1 class="sheet-title">Waypoint</h1>
        <p class="muted">Track every delivery</p>
      </div>
    </div>

    <div class="flash flash-ok" role="status" th:if="${param.signedOut}">You have signed out.</div>

    <nav class="tabs login-tabs" role="tablist" aria-label="Options" data-login-tabs data-fixed="true">
      <a th:if="${demoMode}" href="/login?demo" role="tab" id="tab-demo" aria-controls="pane-demo" data-tab="demo"
         th:attr="aria-selected=${demo}"><svg class="icon"><use href="/img/icons.svg#i-play"></use></svg>Demo</a>
      <a href="/login" role="tab" id="tab-track" aria-controls="pane-track" data-tab="track"
         th:attr="aria-selected=${track}"><svg class="icon"><use href="/img/icons.svg#i-package"></use></svg>Track a parcel</a>
    </nav>

    <section th:if="${demoMode}" class="login-pane" id="pane-demo" role="tabpanel" aria-labelledby="tab-demo" th:hidden="${!demo}">
      <p class="muted small pane-lede">Pick a role to look around. All data is made up.</p>
      <form method="post" action="/demo-login" class="demo-roles">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="demo-role" name="as" value="dispatcher" type="submit"><svg class="icon"><use href="/img/icons.svg#i-map"></use></svg>
          <strong>Dispatcher</strong><span class="small muted">See every trip, plan new ones, book shipments.</span></button>
        <button class="demo-role" name="as" value="driver" type="submit"><svg class="icon"><use href="/img/icons.svg#i-truck"></use></svg>
          <strong>Driver</strong><span class="small muted">Start a trip and mark parcels delivered.</span></button>
      </form>
    </section>

    <section class="login-pane" id="pane-track" role="tabpanel" aria-labelledby="tab-track" th:hidden="${!track}">
      <p class="muted small pane-lede">Enter the tracking number from your receipt.</p>
      <form method="get" action="/track">
        <div class="field">
          <label for="n">Tracking number</label>
          <input id="n" name="n" type="text" required placeholder="FL4100123" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase">
        </div>
        <button class="btn btn-primary btn-block" type="submit">Track parcel</button>
      </form>
    </section>
  </section>
</main>
<script src="/js/login.js"></script>
</body>
</html>
