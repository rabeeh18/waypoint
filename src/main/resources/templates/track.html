<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Track a parcel')}"></head>
<body class="track-body">
<main class="track-card">
  <a class="brand" href="/login"><svg class="logo" style="width:var(--s,28px);height:var(--s,28px)" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" fill="var(--logo-bg,#24231f)"/><path d="M32 12 L50 21 L50 43 L32 52 L14 43 L14 21Z M14 21 L32 30 L50 21 M32 30 L32 52" fill="none" stroke="var(--logo-fg,#f5f1e8)" stroke-width="3.5" stroke-linejoin="round"/></svg><span class="brand-name">Parcelo</span></a>
  <h1>Track a parcel</h1>
  <form method="get" action="/track" class="track-form">
    <input name="n" th:value="${n}" placeholder="Tracking number" required autofocus autocomplete="off">
    <button class="btn btn-primary" type="submit">Track</button>
  </form>
  <p class="flash flash-error" th:if="${problem}" th:text="${problem}">Not found</p>
  <div class="track-result" th:if="${s != null}">
    <p class="track-status" th:text="${status}">Status</p>
    <p class="muted" th:text="${from} + ' → ' + ${s.destName}">A → B</p>
    <p th:if="${eta != null}">Expected around <b th:text="${@fmt.time(eta)}">12:00</b></p>
    <p th:if="${s.status.name() == 'DELIVERED'}">Delivered <span th:text="${@fmt.when(s.deliveredAt)}">today</span></p>
  </div>
</main>
</body>
</html>
