<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
  <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
  <title th:text="${title} + ' · Parcelo'">Parcelo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>

<svg th:fragment="icon(name)" class="icon" aria-hidden="true"><use th:href="'/img/icons.svg#i-' + ${name}"></use></svg>

<svg th:fragment="spot" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0.8 9.4 9.2H0.6z" fill="currentColor"/></svg>

<header th:fragment="header(active)" class="topbar">
  <a class="brand" href="/" aria-label="Parcelo home">
    <svg class="logo" style="width:var(--s,28px);height:var(--s,28px)" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" fill="var(--logo-bg,#24231f)"/><path d="M32 12 L50 21 L50 43 L32 52 L14 43 L14 21Z M14 21 L32 30 L50 21 M32 30 L32 52" fill="none" stroke="var(--logo-fg,#f5f1e8)" stroke-width="3.5" stroke-linejoin="round"/></svg>
    <span><span class="brand-name">Parcelo</span><span class="brand-sub" th:text="${demoMode} ? 'Demo data' : 'Live'">Live</span></span>
  </a>
  <nav aria-label="Main">
    <ul class="nav">
      <li><a href="/dashboard" th:attr="aria-current=${active == 'dashboard'} ? 'page' : null"><svg class="icon"><use href="/img/icons.svg#i-chart-column"></use></svg>Overview</a></li>
      <li><a href="/trips" th:attr="aria-current=${active == 'trips'} ? 'page' : null"><svg class="icon"><use href="/img/icons.svg#i-route"></use></svg>Trips</a></li>
      <li><a href="/planning" th:attr="aria-current=${active == 'planning'} ? 'page' : null"><svg class="icon"><use href="/img/icons.svg#i-calendar-clock"></use></svg>Plan trips</a></li>
      <li><a href="/shipments" th:attr="aria-current=${active == 'shipments'} ? 'page' : null"><svg class="icon"><use href="/img/icons.svg#i-package"></use></svg>Shipments</a></li>
      <li><a href="/fleet/vehicles" th:attr="aria-current=${active == 'fleet'} ? 'page' : null"><svg class="icon"><use href="/img/icons.svg#i-truck"></use></svg>Vehicles</a></li>
    </ul>
  </nav>
  <div class="topbar-right">
    <div class="usermenu">
      <span><span class="usermenu-name" th:text="${me.name}">Name</span><span class="usermenu-role" th:text="${me.role}">Role</span></span>
      <form method="post" action="/logout">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="iconbtn" type="submit" aria-label="Sign out" title="Sign out"><svg class="icon"><use href="/img/icons.svg#i-log-out"></use></svg></button>
      </form>
    </div>
  </div>
</header>

<th:block th:fragment="flash">
  <div class="flash flash-error" role="alert" th:if="${error}"><svg class="icon"><use href="/img/icons.svg#i-circle-x"></use></svg><span th:text="${error}">Error</span></div>
  <div class="flash flash-ok" role="status" th:if="${ok}"><svg class="icon"><use href="/img/icons.svg#i-circle-check"></use></svg><span th:text="${ok}">Done</span></div>
</th:block>

<th:block th:fragment="scripts">
  <div class="toast-stack" data-toasts aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
  <script src="/js/common.js"></script>
</th:block>

<th:block th:fragment="leafletCss">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/map.css">
</th:block>

<th:block th:fragment="leafletJs">
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/map.js"></script>
</th:block>

</body>
</html>
